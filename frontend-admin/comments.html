<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>管理后台 - 留言管理</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/admin.css">
</head>
<body>
<div class="admin-layout">
    <aside class="sidebar" id="sidebar">
        <div class="sidebar-header"><i class="fas fa-flag"></i> 管理后台</div>
        <nav class="sidebar-nav">
            <a href="index.html"><i class="fas fa-tachometer-alt"></i> 仪表盘</a>
            <a href="users.html"><i class="fas fa-users"></i> 用户管理</a>
            <a href="spots.html"><i class="fas fa-map-marker-alt"></i> 景点管理</a>
            <a href="routes.html"><i class="fas fa-route"></i> 线路管理</a>
            <a href="culture.html"><i class="fas fa-book"></i> 文化管理</a>
            <a href="hotels.html"><i class="fas fa-hotel"></i> 酒店管理</a>
            <a href="foods.html"><i class="fas fa-utensils"></i> 美食管理</a>
            <a href="comments.html"><i class="fas fa-comments"></i> 留言管理</a>
            <a href="orders.html"><i class="fas fa-shopping-cart"></i> 订单管理</a>
            <a href="faqs.html"><i class="fas fa-question-circle"></i> FAQ管理</a>
            <div style="border-top:1px solid rgba(255,255,255,.12);margin:8px 12px"></div>
            <a href="feedbacks.html"><i class="fas fa-bullhorn"></i> 问题反馈</a>
            <a href="route-review.html"><i class="fas fa-clipboard-check"></i> 线路审核</a>
            <a href="spot-review.html"><i class="fas fa-search-plus"></i> 景点审核</a>
            <a href="permissions.html"><i class="fas fa-shield-alt"></i> 权限配置</a>
            <a href="customer-service.html"><i class="fas fa-headset"></i> 人工客服</a>
        </nav>
    </aside>
    <div class="main-content">
        <header class="top-bar">
            <button class="menu-toggle" onclick="toggleSidebar()"><i class="fas fa-bars"></i></button>
            <h1>留言管理</h1>
            <div class="top-bar-right"><span id="adminName"></span> <a href="#" onclick="doLogout()">退出</a></div>
        </header>
        <div class="content">
            <div class="card">
                <div class="filter-bar">
                    <input class="form-control" id="fKeyword" placeholder="搜索留言内容" onkeydown="if(event.key==='Enter')loadData(1)">
                    <button class="btn btn-primary" onclick="loadData(1)"><i class="fas fa-search"></i> 搜索</button>
                </div>
                <div class="table-wrapper">
                    <table>
                        <thead><tr><th>ID</th><th>用户</th><th>类型</th><th>内容</th><th>评分</th><th>回复</th><th>时间</th><th>操作</th></tr></thead>
                        <tbody id="tableBody"><tr><td colspan="8" class="loading"><i class="fas fa-spinner fa-spin"></i> 加载中...</td></tr></tbody>
                    </table>
                </div>
                <div class="pagination" id="pagination"></div>
            </div>
        </div>
    </div>
</div>

<div class="modal-overlay" id="replyModal">
    <div class="modal">
        <div class="modal-header"><h3>回复留言</h3><button class="modal-close" onclick="closeReplyModal()">&times;</button></div>
        <div class="modal-body">
            <input type="hidden" id="replyId">
            <div class="form-group">
                <label>原始留言</label>
                <div id="originalContent" style="padding:10px;background:#f5f5f5;border-radius:4px;font-size:14px;color:#666;margin-bottom:12px;"></div>
            </div>
            <div class="form-group">
                <label>回复内容</label>
                <textarea class="form-control" id="replyContent" placeholder="请输入回复内容"></textarea>
            </div>
        </div>
        <div class="modal-footer">
            <button class="btn btn-default" onclick="closeReplyModal()">取消</button>
            <button class="btn btn-primary" onclick="submitReply()"><i class="fas fa-reply"></i> 回复</button>
        </div>
    </div>
</div>

<script src="js/admin-common.js"></script>
<script>
if (!requireAdmin()) throw '';
renderSidebar();

let currentPage = 1;

async function loadData(page) {
    currentPage = page;
    const keyword = document.getElementById('fKeyword').value.trim();
    let url = `/api/admin/comment/list?page=${page}&size=10`;
    if (keyword) url += `&keyword=${encodeURIComponent(keyword)}`;

    document.getElementById('tableBody').innerHTML = '<tr><td colspan="8" class="loading"><i class="fas fa-spinner fa-spin"></i> 加载中...</td></tr>';
    const data = await api(url);
    if (!data) { document.getElementById('tableBody').innerHTML = '<tr><td colspan="8" class="empty-state">加载失败</td></tr>'; return; }

    const list = data.records || data.list || data || [];
    const total = data.pages || data.totalPages || Math.ceil((data.total || list.length) / 10);
    if (!list.length) { document.getElementById('tableBody').innerHTML = '<tr><td colspan="8" class="empty-state"><i class="fas fa-inbox"></i> 暂无数据</td></tr>'; document.getElementById('pagination').innerHTML = ''; return; }

    let h = '';
    list.forEach(c => {
        const content = escHtml(c.content || '').substring(0, 60) + ((c.content || '').length > 60 ? '...' : '');
        const reply = c.replyContent ? `<span style="color:#52c41a" title="${escHtml(c.replyContent)}">已回复</span>` : '<span style="color:#999">未回复</span>';
        h += `<tr>
            <td>${c.id}</td>
            <td>${escHtml(c.username || c.nickname || '-')}</td>
            <td>${escHtml(c.targetType || c.type || '-')}</td>
            <td title="${escHtml(c.content)}">${content}</td>
            <td>${renderStars(c.rating || c.score)}</td>
            <td>${reply}</td>
            <td>${formatDate(c.createTime || c.createdAt)}</td>
            <td class="action-btns">
                <button class="btn btn-sm btn-info" onclick="openReplyModal(${c.id}, '${escHtml(c.content || '').replace(/'/g, "\\'")}')"><i class="fas fa-reply"></i></button>
                <button class="btn btn-sm btn-danger" onclick="deleteItem(${c.id})"><i class="fas fa-trash"></i></button>
            </td>
        </tr>`;
    });
    document.getElementById('tableBody').innerHTML = h;
    renderPagination('pagination', currentPage, total, 'loadData');
}

function openReplyModal(id, content) {
    document.getElementById('replyId').value = id;
    document.getElementById('originalContent').textContent = content;
    document.getElementById('replyContent').value = '';
    document.getElementById('replyModal').classList.add('active');
}
function closeReplyModal() { document.getElementById('replyModal').classList.remove('active'); }

async function submitReply() {
    const id = document.getElementById('replyId').value;
    const content = document.getElementById('replyContent').value.trim();
    if (!content) { showToast('请输入回复内容', 'warning'); return; }
    const data = await api('/api/admin/comment/reply?id=' + id + '&replyContent=' + encodeURIComponent(content));
    if (data !== null) { showToast('回复成功'); closeReplyModal(); loadData(currentPage); }
}

function deleteItem(id) {
    showConfirm('确定要删除该留言吗？', async () => {
        const data = await api('/api/admin/comment/delete?id=' + id);
        if (data !== null) { showToast('删除成功'); loadData(currentPage); }
    });
}

loadData(1);
</script>
</body>
</html>
