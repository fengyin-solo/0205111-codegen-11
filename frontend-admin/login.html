<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>管理后台 - 登录</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/admin.css">
</head>
<body>
<div class="login-page">
    <div class="login-card">
        <h2><i class="fas fa-flag" style="color:#C41A1A"></i> 贵州红色文旅</h2>
        <p>管理后台登录</p>
        <div class="form-group">
            <label>用户名</label>
            <input class="form-control" id="username" placeholder="请输入用户名" autocomplete="username">
        </div>
        <div class="form-group">
            <label>密码</label>
            <input class="form-control" id="password" type="password" placeholder="请输入密码" autocomplete="current-password">
        </div>
        <button class="btn btn-primary" id="loginBtn" onclick="doLogin()">
            <i class="fas fa-sign-in-alt"></i> 登 录
        </button>
    </div>
</div>
<script src="js/admin-common.js"></script>
<script>
(function() {
    const u = getUser();
    if (u && (u.role === 'ADMIN' || u.role === 'STAFF')) location.href = 'index.html';
})();

document.getElementById('password').addEventListener('keydown', e => { if (e.key === 'Enter') doLogin(); });

async function doLogin() {
    const username = document.getElementById('username').value.trim();
    const password = document.getElementById('password').value.trim();
    if (!username || !password) { showToast('请输入用户名和密码', 'warning'); return; }
    const btn = document.getElementById('loginBtn');
    btn.disabled = true; btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> 登录中...';
    try {
        const data = await api('/api/auth/login?username=' + encodeURIComponent(username) + '&password=' + encodeURIComponent(password));
        if (!data) { btn.disabled = false; btn.innerHTML = '<i class="fas fa-sign-in-alt"></i> 登 录'; return; }
        if (data.role !== 'ADMIN' && data.role !== 'STAFF') {
            showToast('该账号无管理端访问权限', 'error');
            btn.disabled = false; btn.innerHTML = '<i class="fas fa-sign-in-alt"></i> 登 录'; return;
        }
        saveUser(data);
        showToast('登录成功');
        setTimeout(() => location.href = 'index.html', 500);
    } catch (e) {
        showToast('登录失败', 'error');
        btn.disabled = false; btn.innerHTML = '<i class="fas fa-sign-in-alt"></i> 登 录';
    }
}
</script>
</body>
</html>
