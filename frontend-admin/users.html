<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>管理后台 - 用户管理</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/admin.css">
</head>
<body>
<div class="admin-layout">
    <aside class="sidebar" id="sidebar">
        <div class="sidebar-header"><i class="fas fa-flag"></i> 管理后台</div>
        <nav class="sidebar-nav">
            <a href="index.html"><i class="fas fa-tachometer-alt"></i> 仪表盘</a>
            <a href="users.html"><i class="fas fa-users"></i> 用户管理</a>
            <a href="spots.html"><i class="fas fa-map-marker-alt"></i> 景点管理</a>
            <a href="routes.html"><i class="fas fa-route"></i> 线路管理</a>
            <a href="culture.html"><i class="fas fa-book"></i> 文化管理</a>
            <a href="hotels.html"><i class="fas fa-hotel"></i> 酒店管理</a>
            <a href="foods.html"><i class="fas fa-utensils"></i> 美食管理</a>
            <a href="comments.html"><i class="fas fa-comments"></i> 留言管理</a>
            <a href="orders.html"><i class="fas fa-shopping-cart"></i> 订单管理</a>
            <a href="faqs.html"><i class="fas fa-question-circle"></i> FAQ管理</a>
            <div style="border-top:1px solid rgba(255,255,255,.12);margin:8px 12px"></div>
            <a href="feedbacks.html"><i class="fas fa-bullhorn"></i> 问题反馈</a>
            <a href="route-review.html"><i class="fas fa-clipboard-check"></i> 线路审核</a>
            <a href="spot-review.html"><i class="fas fa-search-plus"></i> 景点审核</a>
            <a href="permissions.html"><i class="fas fa-shield-alt"></i> 权限配置</a>
            <a href="customer-service.html"><i class="fas fa-headset"></i> 人工客服</a>
        </nav>
    </aside>
    <div class="main-content">
        <header class="top-bar">
            <button class="menu-toggle" onclick="toggleSidebar()"><i class="fas fa-bars"></i></button>
            <h1>用户管理</h1>
            <div class="top-bar-right"><span id="adminName"></span> <a href="#" onclick="doLogout()">退出</a></div>
        </header>
        <div class="content">
            <div class="card">
                <div class="filter-bar">
                    <select class="form-control" id="fRole" onchange="loadData(1)">
                        <option value="">全部角色</option>
                        <option value="USER">用户</option>
                        <option value="ADMIN">管理员</option>
                    </select>
                    <select class="form-control" id="fStatus" onchange="loadData(1)">
                        <option value="">全部状态</option>
                        <option value="1">正常</option>
                        <option value="0">禁用</option>
                    </select>
                    <input class="form-control" id="fKeyword" placeholder="搜索用户名/昵称/手机" onkeydown="if(event.key==='Enter')loadData(1)">
                    <button class="btn btn-primary" onclick="loadData(1)"><i class="fas fa-search"></i> 搜索</button>
                    <button class="btn btn-success" onclick="openUserModal()"><i class="fas fa-plus"></i> 新增用户</button>
                    <button class="btn btn-info" onclick="exportUsers()"><i class="fas fa-file-export"></i> 导出CSV</button>
                </div>
                <div class="table-wrapper">
                    <table>
                        <thead><tr><th>ID</th><th>用户名</th><th>昵称</th><th>手机</th><th>角色</th><th>状态</th><th>操作</th></tr></thead>
                        <tbody id="tableBody"><tr><td colspan="7" class="loading"><i class="fas fa-spinner fa-spin"></i> 加载中...</td></tr></tbody>
                    </table>
                </div>
                <div class="pagination" id="pagination"></div>
            </div>
        </div>
    </div>
</div>

<div class="modal-overlay" id="pwdModal">
    <div class="modal">
        <div class="modal-header"><h3>重置密码</h3><button class="modal-close" onclick="closePwdModal()">&times;</button></div>
        <div class="modal-body">
            <input type="hidden" id="pwdUserId">
            <div class="form-group">
                <label>新密码</label>
                <input class="form-control" id="newPassword" type="password" placeholder="请输入新密码">
            </div>
        </div>
        <div class="modal-footer">
            <button class="btn btn-default" onclick="closePwdModal()">取消</button>
            <button class="btn btn-primary" onclick="submitResetPwd()">确认重置</button>
        </div>
    </div>
</div>

<div class="modal-overlay" id="userModal">
    <div class="modal">
        <div class="modal-header"><h3 id="userModalTitle">新增用户</h3><button class="modal-close" onclick="closeUserModal()">&times;</button></div>
        <div class="modal-body">
            <input type="hidden" id="editUserId">
            <div class="form-group"><label>用户名</label><input class="form-control" id="editUsername" placeholder="用户名"></div>
            <div class="form-group"><label>昵称</label><input class="form-control" id="editNickname" placeholder="昵称"></div>
            <div class="form-group"><label>手机号</label><input class="form-control" id="editPhone" placeholder="手机号"></div>
            <div class="form-group"><label>密码</label><input class="form-control" id="editPassword" type="password" placeholder="密码（编辑时留空不修改）"></div>
            <div class="form-group"><label>角色</label>
                <select class="form-control" id="editRole"><option value="USER">游客</option><option value="ADMIN">管理员</option></select>
            </div>
        </div>
        <div class="modal-footer">
            <button class="btn btn-default" onclick="closeUserModal()">取消</button>
            <button class="btn btn-primary" onclick="submitUser()">保存</button>
        </div>
    </div>
</div>

<script src="js/admin-common.js"></script>
<script>
if (!requireAdmin()) throw '';
renderSidebar();

let currentPage = 1;

async function loadData(page) {
    currentPage = page;
    const role = document.getElementById('fRole').value;
    const status = document.getElementById('fStatus').value;
    const keyword = document.getElementById('fKeyword').value.trim();
    let url = `/api/admin/user/list?page=${page}&size=10`;
    if (role) url += `&role=${role}`;
    if (status) url += `&status=${status}`;
    if (keyword) url += `&keyword=${encodeURIComponent(keyword)}`;

    document.getElementById('tableBody').innerHTML = '<tr><td colspan="7" class="loading"><i class="fas fa-spinner fa-spin"></i> 加载中...</td></tr>';
    const data = await api(url);
    if (!data) { document.getElementById('tableBody').innerHTML = '<tr><td colspan="7" class="empty-state">加载失败</td></tr>'; return; }

    const list = data.records || data.list || data || [];
    const total = data.pages || data.totalPages || Math.ceil((data.total || list.length) / 10);
    if (!list.length) { document.getElementById('tableBody').innerHTML = '<tr><td colspan="7" class="empty-state"><i class="fas fa-inbox"></i> 暂无数据</td></tr>'; document.getElementById('pagination').innerHTML = ''; return; }

    let h = '';
    list.forEach(u => {
        const statusBadge = u.status === 0 ? '<span class="badge badge-danger">禁用</span>' : '<span class="badge badge-success">正常</span>';
        const roleBadge = u.role === 'ADMIN' ? '<span class="badge badge-warning">管理员</span>' : '<span class="badge badge-info">用户</span>';
        const toggleText = u.status === 0 ? '启用' : '禁用';
        const toggleClass = u.status === 0 ? 'btn-success' : 'btn-warning';
        h += `<tr>
            <td>${u.id}</td>
            <td>${escHtml(u.username)}</td>
            <td>${escHtml(u.nickname || '-')}</td>
            <td>${escHtml(u.phone || '-')}</td>
            <td>${roleBadge}</td>
            <td>${statusBadge}</td>
            <td class="action-btns">
                <button class="btn btn-sm btn-primary" onclick="editUser(${u.id},'${escHtml(u.username)}','${escHtml(u.nickname||'')}','${escHtml(u.phone||'')}','${u.role}')">编辑</button>
                <button class="btn btn-sm ${toggleClass}" onclick="toggleStatus(${u.id})">${toggleText}</button>
                <button class="btn btn-sm btn-info" onclick="openPwdModal(${u.id})">重置密码</button>
                <button class="btn btn-sm btn-danger" onclick="deleteUser(${u.id})">删除</button>
            </td>
        </tr>`;
    });
    document.getElementById('tableBody').innerHTML = h;
    renderPagination('pagination', currentPage, total, 'loadData');
}

async function toggleStatus(id) {
    const data = await api('/api/admin/user/toggleStatus?id=' + id);
    if (data !== null) { showToast('操作成功'); loadData(currentPage); }
}

function deleteUser(id) {
    showConfirm('确定要删除该用户吗？此操作不可恢复。', async () => {
        const data = await api('/api/admin/user/delete?id=' + id);
        if (data !== null) { showToast('删除成功'); loadData(currentPage); }
    });
}

function openPwdModal(id) {
    document.getElementById('pwdUserId').value = id;
    document.getElementById('newPassword').value = '';
    document.getElementById('pwdModal').classList.add('active');
}
function closePwdModal() { document.getElementById('pwdModal').classList.remove('active'); }

async function submitResetPwd() {
    const id = document.getElementById('pwdUserId').value;
    const pw = document.getElementById('newPassword').value.trim();
    if (!pw) { showToast('请输入新密码', 'warning'); return; }
    const data = await api('/api/admin/user/resetPassword?id=' + id + '&newPassword=' + encodeURIComponent(pw));
    if (data !== null) { showToast('密码重置成功'); closePwdModal(); }
}

function openUserModal(isEdit) {
    document.getElementById('userModalTitle').textContent = isEdit ? '编辑用户' : '新增用户';
    if (!isEdit) {
        document.getElementById('editUserId').value = '';
        document.getElementById('editUsername').value = '';
        document.getElementById('editNickname').value = '';
        document.getElementById('editPhone').value = '';
        document.getElementById('editPassword').value = '';
        document.getElementById('editRole').value = 'USER';
        document.getElementById('editUsername').disabled = false;
    }
    document.getElementById('userModal').classList.add('active');
}
function closeUserModal() { document.getElementById('userModal').classList.remove('active'); }

function editUser(id, username, nickname, phone, role) {
    document.getElementById('editUserId').value = id;
    document.getElementById('editUsername').value = username;
    document.getElementById('editUsername').disabled = true;
    document.getElementById('editNickname').value = nickname;
    document.getElementById('editPhone').value = phone;
    document.getElementById('editPassword').value = '';
    document.getElementById('editRole').value = role || 'USER';
    openUserModal(true);
}

async function submitUser() {
    var id = document.getElementById('editUserId').value;
    var username = document.getElementById('editUsername').value.trim();
    var nickname = document.getElementById('editNickname').value.trim();
    var phone = document.getElementById('editPhone').value.trim();
    var password = document.getElementById('editPassword').value.trim();
    var role = document.getElementById('editRole').value;
    if (!username) { showToast('请输入用户名', 'warning'); return; }
    var url = '/api/admin/user/save?username=' + encodeURIComponent(username) + '&role=' + role;
    if (id) url += '&id=' + id;
    if (nickname) url += '&nickname=' + encodeURIComponent(nickname);
    if (phone) url += '&phone=' + encodeURIComponent(phone);
    if (password) url += '&password=' + encodeURIComponent(password);
    var data = await api(url);
    if (data !== null) { showToast(id ? '编辑成功' : '新增成功'); closeUserModal(); loadData(currentPage); }
}

function exportUsers() {
    window.open(API + '/api/admin/user/export', '_blank');
}

loadData(1);
</script>
</body>
</html>
