<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>管理后台 - FAQ管理</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/admin.css">
</head>
<body>
<div class="admin-layout">
    <aside class="sidebar" id="sidebar">
        <div class="sidebar-header"><i class="fas fa-flag"></i> 管理后台</div>
        <nav class="sidebar-nav">
            <a href="index.html"><i class="fas fa-tachometer-alt"></i> 仪表盘</a>
            <a href="users.html"><i class="fas fa-users"></i> 用户管理</a>
            <a href="spots.html"><i class="fas fa-map-marker-alt"></i> 景点管理</a>
            <a href="routes.html"><i class="fas fa-route"></i> 线路管理</a>
            <a href="culture.html"><i class="fas fa-book"></i> 文化管理</a>
            <a href="hotels.html"><i class="fas fa-hotel"></i> 酒店管理</a>
            <a href="foods.html"><i class="fas fa-utensils"></i> 美食管理</a>
            <a href="comments.html"><i class="fas fa-comments"></i> 留言管理</a>
            <a href="orders.html"><i class="fas fa-shopping-cart"></i> 订单管理</a>
            <a href="faqs.html"><i class="fas fa-question-circle"></i> FAQ管理</a>
            <div style="border-top:1px solid rgba(255,255,255,.12);margin:8px 12px"></div>
            <a href="feedbacks.html"><i class="fas fa-bullhorn"></i> 问题反馈</a>
            <a href="route-review.html"><i class="fas fa-clipboard-check"></i> 线路审核</a>
            <a href="spot-review.html"><i class="fas fa-search-plus"></i> 景点审核</a>
            <a href="permissions.html"><i class="fas fa-shield-alt"></i> 权限配置</a>
            <a href="customer-service.html"><i class="fas fa-headset"></i> 人工客服</a>
        </nav>
    </aside>
    <div class="main-content">
        <header class="top-bar">
            <button class="menu-toggle" onclick="toggleSidebar()"><i class="fas fa-bars"></i></button>
            <h1>FAQ管理</h1>
            <div class="top-bar-right"><span id="adminName"></span> <a href="#" onclick="doLogout()">退出</a></div>
        </header>
        <div class="content">
            <div class="card">
                <div class="card-header">
                    <h2>常见问题列表</h2>
                    <button class="btn btn-primary" onclick="openModal()"><i class="fas fa-plus"></i> 新增FAQ</button>
                </div>
                <div class="table-wrapper">
                    <table>
                        <thead><tr><th>ID</th><th>问题</th><th>答案</th><th>排序</th><th>操作</th></tr></thead>
                        <tbody id="tableBody"><tr><td colspan="5" class="loading"><i class="fas fa-spinner fa-spin"></i> 加载中...</td></tr></tbody>
                    </table>
                </div>
                <div class="pagination" id="pagination"></div>
            </div>
        </div>
    </div>
</div>

<div class="modal-overlay" id="formModal">
    <div class="modal">
        <div class="modal-header"><h3 id="modalTitle">新增FAQ</h3><button class="modal-close" onclick="closeModal()">&times;</button></div>
        <div class="modal-body">
            <input type="hidden" id="fId">
            <div class="form-group"><label>问题</label><input class="form-control" id="fQuestion" placeholder="常见问题"></div>
            <div class="form-group"><label>答案</label><textarea class="form-control" id="fAnswer" style="min-height:120px" placeholder="问题答案"></textarea></div>
            <div class="form-group"><label>排序(数字越小越靠前)</label><input class="form-control" id="fSortOrder" type="number" placeholder="0"></div>
        </div>
        <div class="modal-footer">
            <button class="btn btn-default" onclick="closeModal()">取消</button>
            <button class="btn btn-primary" onclick="saveItem()"><i class="fas fa-save"></i> 保存</button>
        </div>
    </div>
</div>

<script src="js/admin-common.js"></script>
<script>
if (!requireAdmin()) throw '';
renderSidebar();

let currentPage = 1;

async function loadData(page) {
    currentPage = page || 1;
    document.getElementById('tableBody').innerHTML = '<tr><td colspan="5" class="loading"><i class="fas fa-spinner fa-spin"></i> 加载中...</td></tr>';
    const data = await api(`/api/faq/list?page=${currentPage}&size=10`);
    if (!data) { document.getElementById('tableBody').innerHTML = '<tr><td colspan="5" class="empty-state">加载失败</td></tr>'; return; }

    const list = Array.isArray(data) ? data : (data.records || data.list || []);
    const total = data.pages || data.totalPages || Math.ceil((data.total || list.length) / 10) || 1;
    if (!list.length) { document.getElementById('tableBody').innerHTML = '<tr><td colspan="5" class="empty-state"><i class="fas fa-inbox"></i> 暂无数据</td></tr>'; document.getElementById('pagination').innerHTML = ''; return; }

    let h = '';
    list.forEach(f => {
        const answer = escHtml(f.answer || '').substring(0, 80) + ((f.answer || '').length > 80 ? '...' : '');
        h += `<tr>
            <td>${f.id}</td>
            <td>${escHtml(f.question)}</td>
            <td title="${escHtml(f.answer)}">${answer}</td>
            <td>${f.sortOrder != null ? f.sortOrder : '-'}</td>
            <td class="action-btns">
                <button class="btn btn-sm btn-info" onclick="editItem(${f.id})"><i class="fas fa-edit"></i></button>
                <button class="btn btn-sm btn-danger" onclick="deleteItem(${f.id})"><i class="fas fa-trash"></i></button>
            </td>
        </tr>`;
    });
    document.getElementById('tableBody').innerHTML = h;
    renderPagination('pagination', currentPage, total, 'loadData');
}

function openModal(item) {
    document.getElementById('modalTitle').textContent = item ? '编辑FAQ' : '新增FAQ';
    document.getElementById('fId').value = item ? item.id : '';
    document.getElementById('fQuestion').value = item ? item.question || '' : '';
    document.getElementById('fAnswer').value = item ? item.answer || '' : '';
    document.getElementById('fSortOrder').value = item ? (item.sortOrder != null ? item.sortOrder : '') : '';
    document.getElementById('formModal').classList.add('active');
}

function closeModal() { document.getElementById('formModal').classList.remove('active'); }

async function editItem(id) {
    const data = await api('/api/faq/detail?id=' + id);
    if (data) openModal(data);
}

async function saveItem() {
    const question = document.getElementById('fQuestion').value.trim();
    if (!question) { showToast('请输入问题', 'warning'); return; }
    const answer = document.getElementById('fAnswer').value.trim();
    if (!answer) { showToast('请输入答案', 'warning'); return; }
    const fields = { question, answer, sortOrder: document.getElementById('fSortOrder').value };
    const id = document.getElementById('fId').value;
    if (id) fields.id = id;
    const params = Object.entries(fields).filter(([,v]) => v !== '').map(([k,v]) => `${k}=${encodeURIComponent(v)}`).join('&');
    const data = await api('/api/admin/faq/save?' + params);
    if (data !== null) { showToast('保存成功'); closeModal(); loadData(currentPage); }
}

function deleteItem(id) {
    showConfirm('确定要删除该FAQ吗？', async () => {
        const data = await api('/api/admin/faq/delete?id=' + id);
        if (data !== null) { showToast('删除成功'); loadData(currentPage); }
    });
}

loadData(1);
</script>
</body>
</html>
