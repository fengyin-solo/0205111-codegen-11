<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>重置密码 - 贵州红色旅游</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
<header class="header">
    <div class="container header-inner">
        <a href="index.html" class="logo"><i class="fas fa-flag"></i> <span data-i18n="home">贵州红色旅游</span></a>
        <nav class="nav">
            <a href="index.html" data-i18n="home">首页</a>
            <a href="spots.html" data-i18n="spots">景点</a>
            <a href="routes.html" data-i18n="routes">线路</a>
            <a href="culture.html" data-i18n="culture">红色文化</a>
            <a href="hotels.html" data-i18n="hotels">酒店</a>
            <a href="foods.html" data-i18n="foods">美食</a>
            <a href="faq.html" data-i18n="faq">客服</a>
        </nav>
        <div class="header-right">
            <div class="lang-switcher"><select id="langSelect" onchange="switchLang(this.value)"><option value="zh">中文</option><option value="en">English</option><option value="ja">日本語</option></select></div>
            <div id="userMenu"></div>
        </div>
    </div>
</header>

<div class="form-page">
    <div class="form-card">
        <h2><i class="fas fa-key" style="color:var(--red);margin-right:8px"></i>重置密码</h2>
        <p class="subtitle">通过手机号和旧密码重置您的密码</p>
        <div class="form-group">
            <label><i class="fas fa-phone"></i> 手机号</label>
            <input type="tel" id="phone" placeholder="请输入注册手机号">
        </div>
        <div class="form-group">
            <label><i class="fas fa-lock"></i> 旧密码</label>
            <input type="password" id="oldPassword" placeholder="请输入旧密码">
        </div>
        <div class="form-group">
            <label><i class="fas fa-lock"></i> 新密码</label>
            <input type="password" id="newPassword" placeholder="请输入新密码">
        </div>
        <div class="form-actions">
            <button class="btn btn-primary" onclick="doReset()">重置密码</button>
        </div>
        <div class="form-footer">
            <a href="login.html">返回登录</a>
        </div>
    </div>
</div>

<footer class="footer"><div class="container"><p>© 2026 贵州红色文化旅游景点信息管理系统</p></div></footer>

<script src="js/common.js"></script>
<script>
document.getElementById('newPassword').addEventListener('keydown', function(e) {
    if (e.key === 'Enter') doReset();
});

async function doReset() {
    var phone = document.getElementById('phone').value.trim();
    var oldPassword = document.getElementById('oldPassword').value.trim();
    var newPassword = document.getElementById('newPassword').value.trim();
    if (!phone || !oldPassword || !newPassword) { showToast('请填写所有字段', 'error'); return; }
    var data = await api('/api/auth/resetPassword?phone=' + encodeURIComponent(phone) + '&oldPassword=' + encodeURIComponent(oldPassword) + '&newPassword=' + encodeURIComponent(newPassword));
    if (data !== null) {
        showToast('密码重置成功，请重新登录');
        setTimeout(function() { location.href = 'login.html'; }, 1000);
    }
}
</script>
</body>
</html>
